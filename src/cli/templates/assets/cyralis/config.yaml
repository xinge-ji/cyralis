# Cyralis host-neutral configuration.

memory_root: .cyralis/memory
max_recent_turns: 10

workflow:
  helper: .cyralis/tools/work.py
  host_skill_roots:
    claude: .claude/skills
    codex: .codex/skills
    pi: .pi/skills
  reference_root: .cyralis/reference
  template_root: .cyralis/templates
  roots:
    roadmap: .cyralis/roadmap
    feature: .cyralis/features
    issue: .cyralis/issues
    refactor: .cyralis/refactors
  statuses:
    - no_task
    - design
    - implement
    - verify
    - done

hosts:
  claude:
    enabled: true
  codex:
    enabled: true
  pi:
    enabled: true
